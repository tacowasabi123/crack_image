<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메종 레브</title>
<meta name="description" content="한 명씩 문을 여는 메이드 카페, 메종 레브">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Song+Myung&display=swap" rel="stylesheet">
<style>
:root{
  --velvet:#1e3a33;      /* 벨벳 그린 */
  --velvet-deep:#142822;
  --brass:#b38b4a;       /* 놋쇠 */
  --brass-soft:#d7b985;
  --wine:#6b2737;        /* 와인 */
  --paper:#f6ede9;       /* 분칠한 종이 */
  --paper-2:#efe2dc;
  --ink:#2a2125;
  --ink-soft:#6a5b60;
  --card:#fbf5f2;
  --line:rgba(107,39,55,.22);
  --shadow:0 10px 28px rgba(42,33,37,.14);
}
:root[data-theme="dark"]{
  --paper:#17211e;
  --paper-2:#1d2a26;
  --ink:#f1e7e2;
  --ink-soft:#b9aaa6;
  --card:#22312c;
  --line:rgba(215,185,133,.28);
  --wine:#e0a1ac;
  --shadow:0 10px 28px rgba(0,0,0,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#17211e;
    --paper-2:#1d2a26;
    --ink:#f1e7e2;
    --ink-soft:#b9aaa6;
    --card:#22312c;
    --line:rgba(215,185,133,.28);
    --wine:#e0a1ac;
    --shadow:0 10px 28px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  word-break:keep-all;margin:0;background:var(--paper);color:var(--ink);
  font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:17px;line-height:1.75;
}
h1,h2,h3{font-family:"Song Myung","Batang",serif;font-weight:400;margin:0;line-height:1.3}
a{color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.wrap{width:min(1080px,100% - 32px);margin-inline:auto}

/* ---------- 입장 화면 ---------- */
.gate{
  position:fixed;inset:0;z-index:100;background:var(--velvet-deep);color:#f3e6d3;
  display:grid;place-items:center;text-align:center;padding:24px;
  transition:opacity .7s ease,visibility .7s;
}
.gate.gone{opacity:0;visibility:hidden}
.door{
  width:min(300px,78vw);aspect-ratio:3/4.3;border:2px solid var(--brass);
  border-radius:150px 150px 6px 6px;position:relative;
  background:linear-gradient(180deg,#244a40,#1a3530);
  display:grid;place-items:center;padding:30px 20px;
  box-shadow:inset 0 0 0 8px var(--velvet-deep),inset 0 0 0 9px var(--brass-soft),0 0 60px rgba(0,0,0,.5);
}
.door h1{font-size:2rem;letter-spacing:.08em}
.door p{margin:6px 0 0;color:var(--brass-soft);font-size:.98rem}
.door .knob{position:absolute;right:26px;top:58%;width:12px;height:12px;border-radius:50%;background:var(--brass-soft)}
.gate button{
  margin-top:26px;padding:12px 34px;border:1.5px solid var(--brass);background:transparent;color:#f3e6d3;
  font:inherit;font-size:1.05rem;border-radius:999px;cursor:pointer;transition:background .25s,color .25s;
}
.gate button:hover{background:var(--brass);color:var(--velvet-deep)}

/* ---------- 헤더 ---------- */
header.top{
  position:sticky;top:0;z-index:50;background:var(--velvet);color:#f3e6d3;
  border-bottom:2px solid var(--brass);
}
header.top .wrap{display:flex;align-items:center;gap:18px;min-height:58px}
.brand{font-family:"Song Myung",serif;font-size:1.3rem;text-decoration:none;white-space:nowrap}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:6px 12px;text-decoration:none;font-size:.95rem;border-radius:999px;white-space:nowrap;color:#e9d9c0}
nav a:hover{background:rgba(255,255,255,.1)}
.theme{
  border:1px solid var(--brass);background:transparent;color:#f3e6d3;width:38px;height:38px;border-radius:50%;
  font-size:1.05rem;cursor:pointer;flex:none;
}

/* ---------- 히어로 ---------- */
.hero{
  background:
    radial-gradient(900px 400px at 85% -10%,rgba(179,139,74,.28),transparent 60%),
    linear-gradient(180deg,var(--velvet) 0%,var(--velvet-deep) 100%);
  color:#f3e6d3;padding:76px 0 84px;
}
.hero .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}
.hero h2{font-size:clamp(2.4rem,6vw,4rem);letter-spacing:.04em}
.hero .fr{color:var(--brass-soft);font-size:1.05rem;margin:4px 0 22px}
.hero p{max-width:34em;margin:0 0 12px;color:#e8dac4}
.board{
  border:1.5px solid var(--brass);border-radius:6px;padding:20px 22px;background:rgba(0,0,0,.18);
  box-shadow:inset 0 0 0 5px rgba(0,0,0,.16);
}
.board h3{font-size:1.2rem;color:var(--brass-soft);margin-bottom:10px}
.board dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.board dt{color:var(--brass-soft)}
.board dd{margin:0}

/* ---------- 섹션 ---------- */
section.block{padding:72px 0}
section.block:nth-of-type(even){background:var(--paper-2)}
.head{margin-bottom:30px}
.head h2{font-size:clamp(1.8rem,4vw,2.5rem);color:var(--wine)}
.head p{margin:8px 0 0;color:var(--ink-soft);max-width:38em}
.rule{width:64px;height:3px;background:var(--brass);margin-top:14px;border-radius:2px}

.manners{margin:0;padding:0;list-style:none;display:grid;gap:12px;max-width:44em}
.manners li{padding:14px 18px 14px 22px;border-left:3px solid var(--brass);background:var(--card);box-shadow:var(--shadow);border-radius:0 6px 6px 0}
.manners b{font-weight:400;color:var(--wine)}

/* ---------- 메이드 소개 ---------- */
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:28px 22px}
.maid{position:relative;display:block;text-decoration:none;color:inherit;text-align:center}
.frame{
  position:relative;aspect-ratio:3/4;border-radius:999px 999px 8px 8px;overflow:hidden;
  border:2px solid var(--brass);background:linear-gradient(160deg,#335c50,#1e3a33);
  box-shadow:var(--shadow);
}
.frame img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.frame .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:"Song Myung",serif;font-size:3.2rem;color:var(--brass-soft)}
.plate{margin:14px auto 0;display:inline-block;min-width:70%;padding:7px 14px;border:1px solid var(--brass);background:var(--card);border-radius:4px}
.plate strong{display:block;font-family:"Song Myung",serif;font-weight:400;font-size:1.25rem}
.plate span{font-size:.9rem;color:var(--ink-soft)}
.maid .line{margin:8px 6px 0;font-size:.95rem;color:var(--ink-soft);word-break:keep-all}
.maid.open .frame{transition:transform .3s ease,box-shadow .3s ease}
.maid.open:hover .frame,.maid.open:focus-visible .frame{transform:translateY(-4px);box-shadow:0 16px 34px rgba(42,33,37,.26)}
.go{display:inline-block;margin-top:10px;padding:6px 16px;border-radius:999px;background:var(--wine);color:#fff;font-size:.92rem}
:root[data-theme="dark"] .go{color:#1b1215}

/* 휴무: 이미지는 보이지만 반투명 검정으로 덮음 */
.maid.closed{cursor:not-allowed}
.maid.closed .frame::after{content:"";position:absolute;inset:0;z-index:2;background:rgba(8,10,10,.62)}
.maid.closed .frame img{filter:grayscale(.4)}
.maid.closed .plate{opacity:.7}
.tag{
  position:absolute;left:50%;top:-10px;transform:translateX(-50%) rotate(-2deg);z-index:3;
  background:var(--card);border:1.5px solid var(--brass);padding:3px 14px;border-radius:4px;
  font-size:.88rem;color:var(--wine);box-shadow:0 3px 8px rgba(0,0,0,.2);white-space:nowrap
}
.tag::before{content:"";position:absolute;left:50%;top:-9px;width:1px;height:9px;background:var(--brass)}

/* ---------- 메뉴 ---------- */
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:26px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px 26px;box-shadow:var(--shadow)}
.sheet h3{font-size:1.35rem;color:var(--wine);margin-bottom:12px;padding-bottom:8px;border-bottom:1px double var(--brass)}
.item{display:flex;align-items:baseline;gap:8px;padding:7px 0}
.item .n{flex:none}
.item .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:16px}
.item .p{flex:none;font-variant-numeric:tabular-nums}
.item small{display:block;color:var(--ink-soft);font-size:.86rem;line-height:1.4}
.note{margin-top:18px;color:var(--ink-soft);font-size:.92rem}

/* ---------- 영업 안내 ---------- */
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.info .sheet h3{border-bottom-style:solid}
.info ul{margin:0;padding:0;list-style:none}
.info li{padding:6px 0;border-bottom:1px dashed var(--line)}
.info li:last-child{border-bottom:0}

footer{background:var(--velvet-deep);color:#cdbd9f;padding:34px 0 40px;text-align:center;font-size:.92rem;border-top:2px solid var(--brass)}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;z-index:90;
  background:var(--velvet-deep);color:#f3e6d3;border:1px solid var(--brass);padding:11px 20px;border-radius:999px;
  font-size:.95rem;transition:opacity .25s,transform .25s;pointer-events:none;max-width:90vw;text-align:center
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  body{font-size:16px}
  .hero{padding:48px 0 56px}
  .hero .wrap{grid-template-columns:1fr}
  .menu{grid-template-columns:1fr}
  section.block{padding:52px 0}
  .staff{grid-template-columns:repeat(2,1fr);gap:26px 14px}
  .brand{font-size:1.15rem}
  header.top .wrap{gap:10px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<!-- 입장 화면 -->
<div class="gate" id="gate" role="dialog" aria-label="입장 화면">
  <div>
    <div class="door">
      <div>
        <h1>메종 레브</h1>
        <p>Maison Rêve</p>
        <p style="margin-top:22px;color:#f3e6d3">어서 오세요, 주인님</p>
      </div>
      <span class="knob" aria-hidden="true"></span>
    </div>
    <button type="button" id="enter">문을 열고 들어가기</button>
  </div>
</div>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#home">메종 레브</a>
    <nav aria-label="메뉴">
      <a href="#about">카페 소개</a>
      <a href="#maids">메이드</a>
      <a href="#menu">메뉴</a>
      <a href="#visit">영업 안내</a>
    </nav>
    <button class="theme" id="theme" type="button" aria-label="화면 밝기 바꾸기">☾</button>
  </div>
</header>

<main>
  <div class="hero" id="home">
    <div class="wrap">
      <div>
        <h2 id="cafeName">메종 레브</h2>
        <div class="fr">Maison Rêve</div>
        <p id="cafeTagline"></p>
        <p id="cafeSub"></p>
      </div>
      <aside class="board" aria-label="오늘의 영업">
        <h3>오늘의 영업</h3>
        <dl id="todayBoard"></dl>
      </aside>
    </div>
  </div>

  <section class="block" id="about">
    <div class="wrap">
      <div class="head">
        <h2>카페 소개</h2>
        <p id="aboutText"></p>
        <div class="rule"></div>
      </div>
      <ul class="manners" id="manners"></ul>
    </div>
  </section>

  <section class="block" id="maids">
    <div class="wrap">
      <div class="head">
        <h2>오늘의 메이드</h2>
        <p>지금 문을 연 메이드를 누르면 이야기가 시작됩니다. 휴무 중인 메이드는 다음 이야기에서 차례로 문을 엽니다.</p>
        <div class="rule"></div>
      </div>
      <div class="staff" id="staff"></div>
    </div>
  </section>

  <section class="block" id="menu">
    <div class="wrap">
      <div class="head">
        <h2>메뉴</h2>
        <p>주문하시면 메이드가 한마디를 곁들여 드립니다.</p>
        <div class="rule"></div>
      </div>
      <div class="menu" id="menuList"></div>
      <p class="note" id="menuNote"></p>
    </div>
  </section>

  <section class="block" id="visit">
    <div class="wrap">
      <div class="head">
        <h2>영업 안내</h2>
        <div class="rule"></div>
      </div>
      <div class="info" id="info"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">이 카페와 등장인물은 모두 가상의 설정입니다. 등장인물은 모두 성인입니다.</div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   여기만 고치면 됩니다.
   ========================================================= */
const SITE = {
  imageBase: "images/메이드카페/",   // 이미지 폴더 (레포 안 경로)
  imageExt: "png"                    // 이미지 확장자
};

const CAFE = {
  name: "메종 레브",
  tagline: "문을 열면, 한 사람이 기다리고 있습니다.",
  sub: "메이드는 한 명씩 차례로 문을 엽니다. 오늘 문을 연 메이드에게 말을 걸어 보세요.",
  about: "골목 끝, 초록 벨벳 문 안쪽에 있는 작은 카페입니다. 메이드마다 하나씩 이야기를 가지고 있고, 이야기는 한 편씩 차례로 열립니다.",
  manners: [
    ["메이드의 이름을 불러 주세요.", "이름을 불러 주면 메이드가 먼저 다가옵니다."],
    ["억지로 묻지 마세요.", "말하고 싶어질 때까지 기다리는 것도 손님의 몫입니다."],
    ["휴무 중인 메이드는 쉬게 해 주세요.", "다음 이야기에서 문을 열 때 다시 만날 수 있습니다."]
  ]
};

/* open:true 인 메이드만 누를 수 있고, 누르면 storyUrl(크랙 스토리 주소)로 이동합니다.
   새 이야기를 만들면 해당 메이드의 open 을 true 로 바꾸고 storyUrl 만 채우세요. */
const STAFF = [
  { name:"한예슬",          role:"신입 메이드", line:"어, 어서 오세요, 주인님♡", image:"한예슬", open:true,  storyUrl:"#" },
  { name:"오세린",          role:"선배 메이드", line:"", image:"오세린", open:false, storyUrl:"" },
  { name:"이지혜",          role:"선배 메이드", line:"", image:"이지혜", open:false, storyUrl:"" },
  { name:"강다은 · 강다인", role:"선배 메이드 (쌍둥이)", line:"", image:"강다은_강다인", open:false, storyUrl:"" },
  { name:"한소연",          role:"점장",       line:"", image:"한소연", open:false, storyUrl:"" }
];

const MENU = [
  { title:"식사", items:[
    ["사랑을 담은 오므라이스", "9,500", "케첩으로 하고 싶은 말을 적어 드립니다."],
    ["주인님 전용 카레", "9,000", ""],
    ["샌드위치 세트", "8,500", ""]
  ]},
  { title:"음료", items:[
    ["아이스 아메리카노", "4,500", ""],
    ["장미 라테", "6,000", ""],
    ["밀크티", "5,500", ""]
  ]},
  { title:"디저트", items:[
    ["수제 푸딩", "5,500", ""],
    ["딸기 쇼트케이크", "7,000", ""],
    ["마들렌 세트", "6,000", ""]
  ]},
  { title:"이벤트 메뉴", items:[
    ["메이드와 함께 마법 걸기", "3,000", "주문한 음료에 주문을 외워 드립니다."],
    ["오늘의 한마디 카드", "2,000", ""]
  ]}
];
const MENU_NOTE = "표시된 메뉴와 가격은 예시입니다. 실제 이야기 속 설정에 맞게 바꿔 주세요.";

const TODAY = [
  ["영업 시간", "낮 12시 ~ 저녁 8시"],
  ["휴무일", "매주 화요일"],
  ["오늘 문을 연 메이드", () => STAFF.filter(s => s.open).map(s => s.name).join(", ") || "아직 없음"]
];
const INFO = [
  { title:"영업 시간", list:["평일  12:00 ~ 20:00","주말  11:00 ~ 21:00","매주 화요일 휴무"] },
  { title:"이용 안내", list:["메이드와의 대화는 이야기를 통해 이뤄집니다.","메이드를 누르면 크랙 스토리로 이동합니다.","새 이야기가 열릴 때마다 메이드가 한 명씩 늘어납니다."] }
];

/* =========================================================
   아래는 건드릴 필요 없습니다.
   ========================================================= */
const $ = id => document.getElementById(id);

// 문구 채우기
$("cafeName").textContent = CAFE.name;
$("cafeTagline").textContent = CAFE.tagline;
$("cafeSub").textContent = CAFE.sub;
$("aboutText").textContent = CAFE.about;
document.title = CAFE.name;
$("manners").innerHTML = CAFE.manners.map(m => `<li><b>${m[0]}</b> ${m[1]}</li>`).join("");
$("menuNote").textContent = MENU_NOTE;
$("todayBoard").innerHTML = TODAY.map(t => `<dt>${t[0]}</dt><dd>${typeof t[1]==="function"?t[1]():t[1]}</dd>`).join("");
$("info").innerHTML = INFO.map(b => `<div class="sheet"><h3>${b.title}</h3><ul>${b.list.map(l=>`<li>${l}</li>`).join("")}</ul></div>`).join("");
$("menuList").innerHTML = MENU.map(g => `
  <div class="sheet"><h3>${g.title}</h3>
  ${g.items.map(i => `<div class="item"><div class="n">${i[0]}${i[2]?`<small>${i[2]}</small>`:""}</div><span class="dots"></span><div class="p">${i[1]}원</div></div>`).join("")}
  </div>`).join("");

// 메이드 카드
let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}
function imgSrc(name){ return SITE.imageBase + encodeURIComponent(name) + "." + SITE.imageExt; }

$("staff").innerHTML = STAFF.map((s, i) => {
  const inner = `
    ${s.open ? "" : `<span class="tag">잠시 휴무</span>`}
    <div class="frame">
      <div class="ph" aria-hidden="true">${s.name.charAt(0)}</div>
      <img src="${imgSrc(s.image)}" alt="${s.name} 프로필" loading="lazy" onerror="this.remove()">
    </div>
    <div class="plate"><strong>${s.name}</strong><span>${s.role}</span></div>
    ${s.open && s.line ? `<p class="line">${s.line}</p>` : ""}
    ${s.open ? `<span class="go">이야기 시작하기</span>` : ""}`;
  return s.open
    ? `<a class="maid open" href="${s.storyUrl}" target="_blank" rel="noopener" aria-label="${s.name}, 이야기 시작하기">${inner}</a>`
    : `<div class="maid closed" role="button" tabindex="0" data-i="${i}" aria-label="${s.name}, 잠시 휴무 중">${inner}</div>`;
}).join("");

document.querySelectorAll(".maid.closed").forEach(el => {
  const say = () => toast(STAFF[el.dataset.i].name + "은(는) 잠시 쉬는 중입니다. 다음 이야기에서 문을 엽니다.");
  el.addEventListener("click", say);
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); say(); } });
});

// 입장 화면
const gate = $("gate");
function openGate(){ gate.classList.add("gone"); try{ sessionStorage.setItem("maid-entered","1"); }catch(e){} }
try{ if (sessionStorage.getItem("maid-entered")) gate.classList.add("gone"); }catch(e){}
$("enter").addEventListener("click", openGate);

// 화면 밝기
const root = document.documentElement;
function applyTheme(t){ root.setAttribute("data-theme", t); $("theme").textContent = t === "dark" ? "☀" : "☾"; }
let saved = null; try{ saved = localStorage.getItem("maid-theme"); }catch(e){}
applyTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("theme").addEventListener("click", () => {
  const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next); try{ localStorage.setItem("maid-theme", next); }catch(e){}
});
</script>
</body>
</html>
