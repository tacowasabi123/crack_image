<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love For You</title>
<meta name="description" content="메이드들이 기다리는 카페, Love For You">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Song+Myung&display=swap" rel="stylesheet">
<style>
:root{
  --velvet:#5a3f6e;      /* 짙은 자두색 (헤더, 푸터) */
  --velvet-deep:#3d2a4d;
  --brass:#d98aa9;       /* 로즈골드 (테두리, 포인트) */
  --brass-soft:#f7cfdc;
  --rose:#e56b9a;        /* 눈동자 분홍 (버튼) */
  --lav:#c7b6ec;         /* 라벤더 */
  --wine:#b43c6d;        /* 제목 강조 */
  --paper:#fff5f7;
  --paper-2:#fbe9f0;
  --ink:#3b2a45;
  --ink-soft:#7a6585;
  --card:#ffffff;
  --line:rgba(180,60,109,.2);
  --shadow:0 10px 26px rgba(90,63,110,.16);
}
:root[data-theme="dark"]{
  --paper:#241a2e;
  --paper-2:#2c2038;
  --ink:#f7e8f0;
  --ink-soft:#c6b3cf;
  --card:#35264a;
  --line:rgba(247,207,220,.25);
  --wine:#f4b3cb;
  --shadow:0 10px 26px rgba(0,0,0,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#241a2e;
    --paper-2:#2c2038;
    --ink:#f7e8f0;
    --ink-soft:#c6b3cf;
    --card:#35264a;
    --line:rgba(247,207,220,.25);
    --wine:#f4b3cb;
    --shadow:0 10px 26px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  word-break:keep-all;margin:0;background:var(--paper);color:var(--ink);
  font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:17px;line-height:1.75;
}
h1,h2,h3{font-family:"Song Myung","Batang",serif;font-weight:400;margin:0;line-height:1.3}
a{color:inherit}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.wrap{width:min(1080px,100% - 32px);margin-inline:auto}

/* ---------- 입장 화면 ---------- */
.gate{
  position:fixed;inset:0;z-index:100;color:#fff;
  background:linear-gradient(rgba(61,42,77,.12),rgba(61,42,77,.5)),url("images/메이드카페/입장배경.png") center/cover no-repeat,var(--velvet-deep);
  display:grid;place-items:center;text-align:center;padding:24px;
  transition:opacity .7s ease,visibility .7s;
}
.gate.gone{opacity:0;visibility:hidden}
.door{padding:26px 34px;border-radius:22px;background:rgba(61,42,77,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1.5px solid rgba(255,255,255,.55)}
.door h1{font-size:2rem;letter-spacing:.08em}
.door p{margin:0;color:var(--brass-soft);font-size:.98rem}
.door .knob{display:none}
.gate button{
  margin-top:14px;padding:14px 38px;border:2px solid #fff;background:var(--rose);color:#fff;
  font:inherit;font-size:1.1rem;font-weight:700;border-radius:999px;cursor:pointer;
  box-shadow:0 6px 22px rgba(0,0,0,.45);animation:gatePulse 2s ease-in-out infinite;
  transition:transform .2s,background .25s;
}
.gate button:hover{background:#ff86b0;transform:scale(1.05)}
.gate .arrow{display:block;margin-top:16px;font-size:1.6rem;line-height:1;color:#fff;text-shadow:0 2px 8px rgba(61,42,77,.7);animation:gateBob 1.4s ease-in-out infinite}
@keyframes gatePulse{0%,100%{box-shadow:0 6px 22px rgba(0,0,0,.45),0 0 0 0 rgba(255,255,255,.6)}50%{box-shadow:0 6px 22px rgba(0,0,0,.45),0 0 0 12px rgba(255,255,255,0)}}
@keyframes gateBob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
@media (prefers-reduced-motion:reduce){.gate button,.gate .arrow{animation:none}}

/* ---------- 헤더 ---------- */
header.top{
  position:sticky;top:0;z-index:50;background:var(--velvet);color:#fff;
  border-bottom:3px solid var(--brass);
}
header.top .wrap{display:flex;align-items:center;gap:18px;min-height:58px}
.brand{font-family:"Song Myung",serif;font-size:1.3rem;text-decoration:none;white-space:nowrap}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:6px 12px;text-decoration:none;font-size:.95rem;border-radius:999px;white-space:nowrap;color:#f3e2ee}
nav a:hover{background:rgba(255,255,255,.15)}
.theme{
  border:1px solid var(--brass-soft);background:transparent;color:#fff;width:38px;height:38px;border-radius:50%;
  font-size:1.05rem;cursor:pointer;flex:none;
}

/* ---------- 히어로 ---------- */
.hero{
  background:
    radial-gradient(900px 400px at 85% -10%,rgba(229,107,154,.35),transparent 60%),
    linear-gradient(180deg,var(--velvet) 0%,var(--velvet-deep) 100%);
  color:#fff;padding:76px 0 84px;
}
.hero .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}
.hero h2{font-size:clamp(2.4rem,6vw,4rem);letter-spacing:.04em;margin-bottom:22px}
.hero .fr{color:var(--brass-soft);font-size:1.05rem;margin:4px 0 22px}
.hero p{max-width:34em;margin:0 0 12px;color:#f6e6ef}
.board{
  border:1.5px solid rgba(255,255,255,.6);border-radius:16px;padding:20px 22px;background:rgba(61,42,77,.55);
}
.board h3{font-size:1.2rem;color:var(--brass-soft);margin-bottom:10px}
.board dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.board dt{color:var(--brass-soft)}
.board dd{margin:0}

/* ---------- 섹션 ---------- */
section.block{padding:72px 0}
section.block:nth-of-type(even){background:var(--paper-2)}
.head{margin-bottom:30px}
.head h2{font-size:clamp(1.8rem,4vw,2.5rem);color:var(--wine)}
.head p{margin:8px 0 0;color:var(--ink-soft);max-width:38em}
.rule{width:64px;height:4px;background:linear-gradient(90deg,var(--rose),var(--lav));margin-top:14px;border-radius:2px}

.manners{margin:0;padding:0;list-style:none;display:grid;gap:12px;max-width:44em}
.manners li{padding:14px 18px 14px 22px;border-left:4px solid var(--brass);background:var(--card);box-shadow:var(--shadow);border-radius:0 12px 12px 0}
.manners b{font-weight:400;color:var(--wine)}

/* ---------- 메이드 소개 ---------- */
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:28px 22px}
.maid{position:relative;display:block;text-decoration:none;color:inherit;text-align:center}
.frame{
  position:relative;aspect-ratio:3/4;border-radius:999px 999px 14px 14px;overflow:hidden;
  border:3px solid var(--brass);background:linear-gradient(160deg,var(--lav),var(--brass-soft));
  box-shadow:var(--shadow);
}
.frame img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.frame .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:"Song Myung",serif;font-size:3.2rem;color:#fff}
.plate{margin:14px auto 0;display:inline-block;min-width:70%;padding:7px 14px;border:1.5px solid var(--brass);background:var(--card);border-radius:10px}
.plate strong{display:block;font-family:"Song Myung",serif;font-weight:400;font-size:1.25rem}
.plate span{font-size:.9rem;color:var(--ink-soft)}
.maid .line{margin:8px 6px 0;font-size:.95rem;color:var(--ink-soft);word-break:keep-all}
.maid.open .frame{transition:transform .3s ease,box-shadow .3s ease}
.maid.open:hover .frame,.maid.open:focus-visible .frame{transform:translateY(-4px);box-shadow:0 16px 34px rgba(90,63,110,.3)}
.frame{display:block;width:100%;padding:0;font:inherit;color:inherit;cursor:pointer}
.frame:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(90,63,110,.3)}
.maid .frame{transition:transform .3s ease,box-shadow .3s ease}
.modal{position:fixed;inset:0;z-index:120;background:rgba(40,24,52,.62);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.modal .card{position:relative;width:min(460px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;background:var(--card);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.4);border:2px solid var(--brass)}
.modal .x{position:absolute;top:12px;right:12px;z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);color:#3b2a45;font-size:22px;line-height:1;cursor:pointer}
.modal .pic{aspect-ratio:4/4.3;background:linear-gradient(160deg,var(--lav),var(--brass-soft));overflow:hidden}
.modal .pic img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block}
.modal .body{padding:20px 24px 26px}
.modal h3{font-size:1.7rem;color:var(--wine)}
.modal .age{color:var(--ink-soft);margin-top:2px}
.modal .nick{margin:8px 0 6px;color:var(--rose);font-weight:700}
.modal h4{margin:16px 0 2px;font-size:.88rem;font-weight:400;color:var(--wine);border-top:1px solid var(--line);padding-top:12px;letter-spacing:.04em}
.modal p{margin:0;font-size:.98rem}
.go.big{display:block;text-align:center;margin-top:22px;padding:12px;font-size:1rem;text-decoration:none}
.go.off{background:var(--ink-soft);opacity:.55;cursor:not-allowed}
.go{display:inline-block;text-decoration:none;margin-top:10px;padding:6px 16px;border-radius:999px;background:var(--rose);color:#fff;font-size:.92rem}
:root[data-theme="dark"] .go{color:#1b1215}

/* 휴무: 이미지는 보이지만 반투명 검정으로 덮음 */
.maid.closed{cursor:default}
.maid.closed .frame{cursor:pointer}
.maid.closed .frame::after{content:"";position:absolute;inset:0;z-index:2;background:rgba(24,14,34,.62)}
.maid.closed .frame img{filter:grayscale(.4)}
.maid.closed .plate{opacity:.7}
.tag{
  position:absolute;left:50%;top:-10px;transform:translateX(-50%) rotate(-2deg);z-index:3;
  background:var(--card);border:1.5px solid var(--brass);padding:3px 14px;border-radius:8px;
  font-size:.88rem;color:var(--wine);box-shadow:0 3px 8px rgba(0,0,0,.2);white-space:nowrap
}
.tag::before{content:"";position:absolute;left:50%;top:-9px;width:1px;height:9px;background:var(--brass)}

/* ---------- 메뉴 ---------- */
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:26px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 26px;box-shadow:var(--shadow)}
.sheet h3{font-size:1.35rem;color:var(--wine);margin-bottom:12px;padding-bottom:8px;border-bottom:2px dotted var(--brass)}
.item{display:flex;align-items:baseline;gap:8px;padding:7px 0}
.item .n{flex:none}
.item .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:16px}
.item .p{flex:none;font-variant-numeric:tabular-nums}
.item small{display:block;color:var(--ink-soft);font-size:.86rem;line-height:1.4}
.note{margin-top:18px;color:var(--ink-soft);font-size:.92rem}

/* ---------- 영업 안내 ---------- */
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.info .sheet h3{border-bottom-style:dotted}
.info ul{margin:0;padding:0;list-style:none}
.info li{padding:6px 0;border-bottom:1px dashed var(--line)}
.info li:last-child{border-bottom:0}

footer{background:var(--velvet-deep);color:#e7d3e2;padding:34px 0 40px;text-align:center;font-size:.92rem;border-top:3px solid var(--brass)}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;z-index:90;
  background:var(--velvet-deep);color:#fff;border:1px solid var(--brass-soft);padding:11px 20px;border-radius:999px;
  font-size:.95rem;transition:opacity .25s,transform .25s;pointer-events:none;max-width:90vw;text-align:center
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  body{font-size:16px}
  .hero{padding:48px 0 56px}
  .hero .wrap{grid-template-columns:1fr}
  .menu{grid-template-columns:1fr}
  section.block{padding:52px 0}
  .staff{grid-template-columns:repeat(2,1fr);gap:26px 14px}
  .brand{font-size:1.15rem}
  header.top .wrap{gap:10px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<!-- 입장 화면 -->
<div class="gate" id="gate" role="dialog" aria-label="입장 화면">
  <div>
    <div class="door">
      <div>
        <h1>Love For You</h1>
        <p style="margin-top:22px;color:#fff">어서 오세요, 주인님</p>
      </div>
      <span class="knob" aria-hidden="true"></span>
    </div>
    <span class="arrow" aria-hidden="true">▼</span>
    <button type="button" id="enter">문을 열고 들어가기</button>
  </div>
</div>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#home">Love For You</a>
    <nav aria-label="메뉴">
      <a href="#about">카페 소개</a>
      <a href="#maids">메이드</a>
      <a href="#menu">메뉴</a>
      <a href="#visit">영업 안내</a>
    </nav>
    <button class="theme" id="theme" type="button" aria-label="화면 밝기 바꾸기">☾</button>
  </div>
</header>

<main>
  <div class="hero" id="home">
    <div class="wrap">
      <div>
        <h2 id="cafeName">Love For You</h2>
        <p id="cafeTagline"></p>
        <p id="cafeSub"></p>
      </div>
      <aside class="board" aria-label="카페 정보">
        <h3>카페 정보</h3>
        <dl id="todayBoard"></dl>
      </aside>
    </div>
  </div>

  <section class="block" id="about">
    <div class="wrap">
      <div class="head">
        <h2>카페 소개</h2>
        <p id="aboutText"></p>
        <div class="rule"></div>
      </div>
      <ul class="manners" id="manners"></ul>
    </div>
  </section>

  <section class="block" id="maids">
    <div class="wrap">
      <div class="head">
        <h2>메이드 소개</h2>
        <p>사진을 누르면 소개를 볼 수 있고, "이야기 시작하기"를 누르면 크랙 스토리로 이동합니다.</p>
        <div class="rule"></div>
      </div>
      <div class="staff" id="staff"></div>
    </div>
  </section>

  <section class="block" id="menu">
    <div class="wrap">
      <div class="head">
        <h2>메뉴</h2>
        <p>주문하시면 메이드가 한마디를 곁들여 드립니다.</p>
        <div class="rule"></div>
      </div>
      <div class="menu" id="menuList"></div>
      <p class="note" id="menuNote"></p>
    </div>
  </section>

  <section class="block" id="visit">
    <div class="wrap">
      <div class="head">
        <h2>영업 안내</h2>
        <div class="rule"></div>
      </div>
      <div class="info" id="info"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">이 카페와 등장인물은 모두 가상의 설정입니다. 등장인물은 모두 성인입니다.</div>
</footer>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mName">
  <div class="card">
    <button type="button" class="x" id="mClose" aria-label="닫기">×</button>
    <div class="pic"><img id="mImg" alt=""></div>
    <div class="body">
      <h3 id="mName"></h3>
      <div class="age" id="mAge"></div>
      <div class="nick" id="mNick"></div>
      <div id="mBody"></div>
      <a class="go big" id="mGo" href="#" rel="noopener">이야기 시작하기</a>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   여기만 고치면 됩니다.
   ========================================================= */
const SITE = {
  imageBase: "images/메이드카페/",   // 이미지 폴더 (레포 안 경로)
  imageExt: "png"                    // 이미지 확장자

const CAFE = {

  manners: [

/* open:true 인 메이드만 "이야기 시작하기"가 켜지고, storyUrl(크랙 스토리 주소)로 이동합니다.

  { name:"이지혜",          age:22, line:"", image:"이지혜", open:false, storyUrl:"",

  { name:"강다은과 강다인", age:25, line:"", image:"강다은과 강다인", open:false, storyUrl:"",
    nick:"샘플 한 줄 소개", personality:"샘플: 성격 소개가 들어갑니다.", like:"샘플", dislike:"샘플" },
  { name:"한소연",          age:30, line:"", image:"한소연", open:false, storyUrl:"",
    nick:"샘플 한 줄 소개", personality:"샘플: 성격 소개가 들어갑니다.", like:"샘플", dislike:"샘플" }
];

const MENU = [
  { title:"식사", items:[
    ["사랑을 담은 오므라이스", "9,500", "케첩으로 하고 싶은 말을 적어 드립니다."],
    ["주인님 전용 카레", "9,000", ""],
    ["샌드위치 세트", "8,500", ""]
  ]},
  { title:"음료", items:[

    ["장미 라테", "6,000", ""],
    ["밀크티", "5,500", ""]
  ]},
  { title:"디저트", items:[
    ["수제 푸딩", "5,500", ""],
    ["딸기 쇼트케이크", "7,000", ""],
    ["마들렌 세트", "6,000", ""]
  ]},
  { title:"이벤트 메뉴", items:[
    ["메이드와 함께 마법 걸기", "3,000", "주문한 음료에 주문을 외워 드립니다."],
    ["오늘의 한마디 카드", "2,000", ""]
  ]}
];
const MENU_NOTE = "표시된 메뉴와 가격은 예시입니다. 실제 이야기 속 설정에 맞게 바꿔 주세요.";

const TODAY = [
  ["영업 시간", "낮 12시 ~ 저녁 8시"],
  ["찾아오는 길", "골목 끝, 분홍색 문"]
];
const INFO = [
  { title:"영업 시간", list:["평일  12:00 ~ 20:00","주말  11:00 ~ 21:00"] },
  { title:"이용 안내", list:["메이드와의 대화는 크랙 스토리에서 이뤄집니다.","메이드 사진을 누르면 소개를 볼 수 있습니다."] }
];

/* =========================================================
   아래는 건드릴 필요 없습니다.
   ========================================================= */
const $ = id => document.getElementById(id);

// 문구 채우기
$("cafeName").textContent = CAFE.name;
$("cafeTagline").textContent = CAFE.tagline;
$("cafeSub").textContent = CAFE.sub;
$("aboutText").textContent = CAFE.about;
document.title = CAFE.name;
$("manners").innerHTML = CAFE.manners.map(m => `<li><b>${m[0]}</b> ${m[1]}</li>`).join("");
$("menuNote").textContent = MENU_NOTE;
$("todayBoard").innerHTML = TODAY.map(t => `<dt>${t[0]}</dt><dd>${typeof t[1]==="function"?t[1]():t[1]}</dd>`).join("");
$("info").innerHTML = INFO.map(b => `<div class="sheet"><h3>${b.title}</h3><ul>${b.list.map(l=>`<li>${l}</li>`).join("")}</ul></div>`).join("");
$("menuList").innerHTML = MENU.map(g => `
  <div class="sheet"><h3>${g.title}</h3>
  ${g.items.map(i => `<div class="item"><div class="n">${i[0]}${i[2]?`<small>${i[2]}</small>`:""}</div><span class="dots"></span><div class="p">${i[1]}원</div></div>`).join("")}
  </div>`).join("");

// 메이드 카드
let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}
function imgSrc(name){ return SITE.imageBase + encodeURIComponent(name) + "." + SITE.imageExt; }

$("staff").innerHTML = STAFF.map((s, i) => `
  <div class="maid ${s.open ? "open" : "closed"}">
    ${s.open ? "" : `<span class="tag">잠시 휴무</span>`}
    <button type="button" class="frame" data-i="${i}" aria-label="${s.name} 소개 보기">
      <div class="ph" aria-hidden="true">${s.name.charAt(0)}</div>
      <img src="${imgSrc(s.image)}" alt="${s.name} 프로필" loading="lazy" onerror="this.remove()">
    </button>
    <div class="plate"><strong>${s.name}</strong><span>${s.age}세</span></div>
    ${s.open ? `<a class="go" href="${s.storyUrl}" target="_blank" rel="noopener">이야기 시작하기</a>` : ""}
  </div>`).join("");

// 소개 팝업
const modal = $("modal");
let lastFocus = null;
function openMaid(i, fromHash){
  const s = STAFF[i]; if (!s) return;
  lastFocus = document.activeElement;
  $("mImg").src = imgSrc(s.image); $("mImg").alt = s.name;
  $("mName").textContent = s.name;
  $("mAge").textContent = s.age + "세";
  $("mNick").textContent = s.nick || "";
  $("mBody").innerHTML = [["성격", s.personality], ["좋아하는 것", s.like], ["싫어하는 것", s.dislike]]
    .filter(r => r[1]).map(r => `<h4>${r[0]}</h4><p>${r[1]}</p>`).join("");
  const go = $("mGo");
  if (s.open) { go.href = s.storyUrl; go.textContent = "이야기 시작하기"; go.classList.remove("off"); go.removeAttribute("aria-disabled"); go.target = "_blank"; }
  else { go.removeAttribute("href"); go.textContent = "잠시 휴무 중"; go.classList.add("off"); go.setAttribute("aria-disabled","true"); }
  modal.hidden = false; document.body.style.overflow = "hidden";
  $("mClose").focus();
  if (!fromHash) history.replaceState(null, "", "#maid-" + encodeURIComponent(s.name));
}
function closeMaid(){
  if (modal.hidden) return;
  modal.hidden = true; document.body.style.overflow = "";
  if (location.hash.startsWith("#maid-")) history.replaceState(null, "", location.pathname + location.search + "#maids");
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
document.querySelectorAll(".frame").forEach(el => el.addEventListener("click", () => openMaid(+el.dataset.i)));
$("mClose").addEventListener("click", closeMaid);
modal.addEventListener("click", e => { if (e.target === modal) closeMaid(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMaid(); });
$("mGo").addEventListener("click", e => { if ($("mGo").classList.contains("off")) e.preventDefault(); });
function openFromHash(){
  const m = decodeURIComponent(location.hash).match(/^#maid-(.+)$/);
  if (!m) return;
  const i = STAFF.findIndex(s => s.name === m[1]);
  if (i >= 0) { gate.classList.add("gone"); openMaid(i, true); }
}

// 입장 화면
const gate = $("gate");
function openGate(){ gate.classList.add("gone"); try{ sessionStorage.setItem("maid-entered","1"); }catch(e){} }
try{ if (sessionStorage.getItem("maid-entered")) gate.classList.add("gone"); }catch(e){}
$("enter").addEventListener("click", openGate);
openFromHash();
addEventListener("hashchange", openFromHash);

// 화면 밝기
const root = document.documentElement;
function applyTheme(t){ root.setAttribute("data-theme", t); $("theme").textContent = t === "dark" ? "☀" : "☾"; }
let saved = null; try{ saved = localStorage.getItem("maid-theme"); }catch(e){}
applyTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("theme").addEventListener("click", () => {
  const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next); try{ localStorage.setItem("maid-theme", next); }catch(e){}
});
</script>
</body>
</html>
